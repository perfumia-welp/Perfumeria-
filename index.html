<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <script>
      // The homepage's largest image (the first hero slide), requested before
      // the app has run. It must match the <img> exactly (same srcset and sizes:
      // HeroCampaign.tsx, data/home.ts) so the browser downloads it once;
      // scripts/audit/products.test.mjs checks the sources.
      ;(function () {
        var base = "%BASE_URL%".replace(/\/$/, "")
        var path = location.pathname.slice(base.length).replace(/^\/ar(?=\/|$)/, "")
        if (path.replace(/\/+$/, "")) return
        var link = document.createElement("link")
        link.rel = "preload"
        link.as = "image"
        link.fetchPriority = "high"
        link.imageSrcset = [700, 1000, 1400, 2000]
          .map(function (width) {
            return "https://images.unsplash.com/photo-1676950933747-5f886cadf014?auto=format&fit=crop&w=" + width + "&q=88 " + width + "w"
          })
          .join(", ")
        link.imageSizes = "(max-width: 767px) 100vw, 52vw"
        document.head.appendChild(link)
      })()
      // Arabic pages (/ar/…): set the language and direction before the
      // first paint. The app keeps <html> in sync afterwards
      // (src/i18n/LocaleProvider.tsx).
      ;(function () {
        var base = "%BASE_URL%".replace(/\/$/, "")
        var path = location.pathname.slice(base.length)
        if (!/^\/ar(\/|$)/.test(path)) return
        var root = document.documentElement
        root.lang = "ar"
        root.dir = "rtl"
      })()
    </script>
    <!--
      Startup screen (#boot below): ivory, the wordmark and a fine gold line.
      It fades in only if the site is not ready within 300 ms, and the app
      removes it the moment the catalogue can be shown (src/lib/bootScreen.ts),
      so it never adds a wait. Inline so it needs no download. If the app never
      starts, it fades away by itself after 20 s.
    -->
    <style>
      html {
        background: #f7f4ee;
      }
      #boot {
        animation:
          boot-in 400ms ease 300ms forwards,
          boot-in 400ms ease 20s reverse forwards;
        align-content: center;
        background: #f7f4ee;
        display: grid;
        gap: 22px;
        inset: 0;
        justify-items: center;
        opacity: 0;
        pointer-events: none;
        position: fixed;
        transition:
          opacity 380ms ease,
          visibility 0s linear 380ms;
        z-index: 1000;
      }
      #boot.is-done {
        animation: none;
        opacity: 0;
        visibility: hidden;
      }
      #boot b {
        color: #181816;
        font: 400 40px/1 "Instrument Serif", Georgia, serif;
        letter-spacing: -0.03em;
      }
      #boot i {
        background: rgba(184, 150, 89, 0.22);
        height: 1px;
        overflow: hidden;
        position: relative;
        width: 120px;
      }
      #boot i::after {
        animation: boot-line 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        background: #b89659;
        content: "";
        inset: 0 auto 0 0;
        position: absolute;
        width: 40%;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-line {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i::after {
          animation: none;
          transform: translateX(75%);
        }
      }
    </style>
    <!--
      Self-hosted fonts (src/styles/fonts.css). Only a few first-screen files
      are preloaded, chosen by measurement (Lighthouse, 2026-11-08):
        every page   Instrument Serif (wordmark, hero title)
        English      its italic (hero title); without it the title shifts
                     when the font swaps in
        Arabic       Noto Naskh Arabic (hero title), IBM Plex Sans Arabic 400
                     (header) and Inter (Latin and digits)
      English does not preload Inter: its metric-matched fallback does not
      move the text, and preloading it slowed the hero photo (LCP).
      The per-language ones (media="not all") stay idle until the script
      below requests the set for this page. Every other face still loads on
      its own when text needs it.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/instrument-serif-400-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/instrument-serif-400-italic-latin.woff2" crossorigin media="not all" data-font-locale="en" />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/inter-latin.woff2" crossorigin media="not all" data-font-locale="ar" />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/noto-naskh-arabic-arabic.woff2" crossorigin media="not all" data-font-locale="ar" />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/ibm-plex-sans-arabic-400-arabic.woff2" crossorigin media="not all" data-font-locale="ar" />
    <script>
      ;(function () {
        var locale = document.documentElement.lang === "ar" ? "ar" : "en"
        var idle = document.querySelectorAll("link[data-font-locale]")
        for (var i = 0; i < idle.length; i++) {
          if (idle[i].getAttribute("data-font-locale") !== locale) continue
          var link = document.createElement("link")
          link.rel = "preload"
          link.as = "font"
          link.type = "font/woff2"
          link.crossOrigin = "anonymous"
          link.href = idle[i].href
          document.head.appendChild(link)
        }
      })()
    </script>
    <!-- Resized company product photos (src/config/catalog.ts). -->
    <link rel="preconnect" href="https://wsrv.nl" />
    <!-- PLACEHOLDER icon: replace with the approved Perfumira mark. The social
         image is the site wordmark on ivory (as the startup screen) until the
         owner supplies a designed one. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Perfumira" />
    <!-- The app rewrites og:image, og:url, canonical, hreflang and robots per
         page with absolute URLs on the public site (src/lib/documentMeta.ts). -->
    <meta property="og:image" content="%SITE_ORIGIN%%BASE_URL%social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="boot" aria-hidden="true"><b>Perfumira</b><i></i></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
