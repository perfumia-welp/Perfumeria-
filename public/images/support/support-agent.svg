<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 14 132 132" role="img" aria-hidden="true">
  <!--
    Temporary support-agent illustration for the contact launcher.
    Square artwork, shown cropped to a circle; replace this file (same name,
    square, subject centred) to change the artwork without touching code.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f4ead9"/>
      <stop offset="1" stop-color="#d9c5a3"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a3529"/>
      <stop offset="1" stop-color="#2f211a"/>
    </linearGradient>
  </defs>

  <rect width="160" height="160" fill="url(#bg)"/>

  <!-- Hair behind the shoulders -->
  <path d="M45 72c0-30 15-46 35-46s35 16 35 46c0 20 3 36-4 52H49c-7-16-4-32-4-52Z" fill="url(#hair)"/>

  <!-- Neck and neckline -->
  <path d="M69 90h22v24l-11 26-11-26Z" fill="#dcae8e"/>
  <path d="M69 98c6 6 16 6 22 0v-8H69Z" fill="#c9987a" opacity=".55"/>

  <!-- Cream jacket -->
  <path d="M14 160c2-24 18-36 44-41l11-7 11 26 11-26 11 7c26 5 42 17 44 41Z" fill="#f9f4ea"/>
  <path d="M69 112l11 26-9 16-15-29Z" fill="#ece1cd"/>
  <path d="M91 112 80 138l9 16 15-29Z" fill="#ece1cd"/>
  <path d="M71 154l9-16 9 16" fill="none" stroke="#d6c6a8" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="80" cy="148" r="1.5" fill="#b89659"/>

  <!-- Face -->
  <path d="M56 66c0-18 10-28 24-28s24 10 24 28c0 17-10 35-24 35S56 83 56 66Z" fill="#ecc8ab"/>
  <circle cx="66" cy="81" r="5.5" fill="#dd9c86" opacity=".22"/>
  <circle cx="94" cy="81" r="5.5" fill="#dd9c86" opacity=".22"/>

  <!-- Side-swept hair -->
  <path d="M53 72c-3-24 9-41 29-41 17 0 28 13 26 39-3-10-9-19-19-24-9 7-21 10-30 12-3 4-5 8-6 14Z" fill="url(#hair)"/>
  <path d="M62 54c9-2 19-5 27-11" fill="none" stroke="#6a4c3a" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>

  <!-- Features -->
  <g fill="none" stroke-linecap="round">
    <path d="M64.500 64.500q5-3 10-1M85.500 63.500q5-2 10 1" stroke="#3a2a21" stroke-width="1.7"/>
    <path d="M66 70.500q4-2.600 8 0M86 70.500q4-2.600 8 0" stroke="#2f211a" stroke-width="1.5"/>
    <path d="M80.500 74q-2 5 .5 8" stroke="#cf9f80" stroke-width="1.3"/>
  </g>
  <ellipse cx="70" cy="72" rx="2.100" ry="2.400" fill="#2f211a"/>
  <ellipse cx="90" cy="72" rx="2.100" ry="2.400" fill="#2f211a"/>
  <path d="M73 88q7 3 14 0q-7 7.500-14 0Z" fill="#b8695c"/>

  <!-- Headset -->
  <path d="M50 70c0-30 13-45 30-45s30 15 30 45" fill="none" stroke="#181816" stroke-width="3.600" stroke-linecap="round"/>
  <path d="M56 40c6-9 14-13 24-13s18 4 24 13" fill="none" stroke="#b89659" stroke-width="1" stroke-linecap="round" opacity=".9"/>
  <rect x="43" y="62" width="12" height="22" rx="6" fill="#181816"/>
  <rect x="105" y="62" width="12" height="22" rx="6" fill="#181816"/>
  <circle cx="49" cy="73" r="2" fill="#b89659"/>
  <circle cx="111" cy="73" r="2" fill="#b89659"/>
  <path d="M48 83c0 11 7 15 17 13.500" fill="none" stroke="#181816" stroke-width="2.200" stroke-linecap="round"/>
  <ellipse cx="67" cy="96" rx="4.200" ry="2.800" transform="rotate(-8 67 96)" fill="#181816"/>
</svg>
